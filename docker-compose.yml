services:
  db:
    image: postgres:16-alpine
    container_name: profit-bi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: profitbi
      POSTGRES_PASSWORD: profitbi
      POSTGRES_DB: profitbi
    ports:
      - "5432:5432"
    volumes:
      - profit-bi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitbi -d profitbi"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  profit-bi-data:
